# One free web service; no paid database, disk, or preview services.
services:
  - type: web
    name: cleardrop
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CLEARDROP_PUBLIC_DEMO
        value: "1"
      - key: CLEARDROP_ACCOUNT_AUTH
        value: "1"
      - key: CLEARDROP_PUBLIC_SIGNUP
        value: "0"
      - key: CLEARDROP_SITE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
